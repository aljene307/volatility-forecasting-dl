# Règles du projet, fixées AVANT tout téléchargement de données et tout calcul.
# Version lisible pour le jury : docs/REGLES.md (les dates doivent y être identiques).
# Toute modification ultérieure est écrite et datée dans docs/CHOIX.md.
# La valeur "a_fixer_apres_mesure" signifie : choisie plus tard, à partir d'une mesure.

[projet]
graine = 42                                # graine aléatoire commune (Python, numpy, torch)
fils_calcul = 2                            # mesuré le 2026-11-16 (rapports/mesures_entrainement.json) : le plus rapide, reproductible
fils_calcul_candidats = [2, 4]             # exception du 2026-11-16 : 8 écarté, mesuré plus lent
seuil_memoire_libre_go = 1.0               # mesuré le 2026-11-16 : pic × 1,5 arrondi ; en dessous, les scripts lourds refusent de démarrer

[donnees]
source = "Binance spot"                    # marché au comptant de Binance
url_source = "https://data.binance.vision" # dépôt public des fichiers historiques
type_fichier = "klines"                    # bougies : ouverture, plus haut, plus bas, clôture, volume
intervalle = "5m"                          # une bougie toutes les 5 minutes
actifs = ["BTCUSDT", "ETHUSDT"]            # bitcoin et ether, cotés en USDT
fuseau = "UTC"                             # un jour va de 00:00 inclus à 24:00 exclu, en UTC
debut = 2018-01-01                         # aucune donnée de 2017 (mois de démarrage de Binance)
fin = 2026-10-31                           # dernier mois complet disponible
horodatage_unite = "detectee_par_fichier"  # millisecondes ou microsecondes, d'après l'ordre de grandeur
licence = "a_verifier_avant_commit_extrait" # vérifiée à l'étape des données

[donnees.jour_valide]
bougies_par_jour = 288                     # 24 h x 12 bougies de 5 minutes
part_min_bougies = 0.95                    # au moins 95 % des bougies du jour
bougies_min = 274                          # 95 % de 288, arrondi au supérieur
ecart_max_minutes = 60                     # au-delà, entre deux bougies consécutives, le jour est non valide
jours_invalides = "exclus_et_rapportes"    # exclus de la cible et de l'évaluation, listés dans un rapport

[donnees.rendements]
enjamber_bougies_manquantes = true         # rendement gardé entre deux clôtures consécutives disponibles
premier_depuis_veille = true               # le 1er rendement part de la dernière clôture disponible de la veille
rendement_manquant_compte_comme_bougie_manquante = true  # pour la règle des 274
premier_jour_donnees = 2018-01-01          # pas de veille (aucune donnée de 2017) : 287 rendements, jour valide
premier_jour_rendements = 287              # ce jour sert au préchauffage et n'est jamais une cible

[donnees.exclusions]
fenetre_entree_jours = 30                  # un exemple est exclu si sa fenêtre d'entrée contient un jour non valide
seuil_secours = 0.05                       # au-delà de 5 % d'exemples exclus, on passe à la règle de secours
secours = "derniere_valeur_valide_connue"  # le jour non valide en entrée prend la dernière valeur valide (passé seul)
seuil_mesure = "une_fois_par_actif"        # taux d'exclusion mesuré une seule fois, pour chaque actif
seuil_mesure_debut = 2018-04-01            # sur tout le développement (dates de cible), jamais sur le test final
seuil_mesure_fin = 2024-12-31
secours_portee = "deux_actifs_partout"     # si un actif dépasse 5 %, le secours s'applique aux deux actifs, partout

[decoupage]
convention_date = "cible"                  # un exemple (variables à la clôture de J, cible RV de J+1) appartient
                                           # à la période qui contient sa cible J+1 ; toutes les bornes sont des dates de cible
dev_debut = 2018-01-01                     # début des données de développement (préchauffage compris)
premiere_cible = 2018-04-01                # première date de cible utilisée
dev_fin = 2024-12-31                       # dernière date de cible du développement
test_debut = 2025-01-01                    # première date de cible du test final
test_fin = 2026-10-31                      # dernière date de cible du test final
test_ouvertures_max = 1                    # le test final est ouvert une seule fois
embargo_jours = 0                          # inutile : aucune cible commune entre apprentissage et évaluation à 1 jour
reapprendre_transformations_par_pli = true # normalisation, etc. réapprises sur l'apprentissage de chaque pli

[decoupage.prechauffage]
debut = 2018-01-01                         # jours servant uniquement à calculer les variables
fin = 2018-03-31                           # aucune cible dans cette période
jours = 90                                 # durée du préchauffage

[decoupage.walk_forward]
fenetre = "croissante"                     # la fenêtre d'apprentissage s'agrandit à chaque pli
premier_apprentissage_debut = 2018-04-01   # première cible d'apprentissage (= premiere_cible)
premier_apprentissage_fin = 2019-12-31     # dernière cible du premier apprentissage
plis_debut = 2020-01-01                    # première cible évaluée
plis_fin = 2024-12-31                      # dernière cible évaluée
duree_pli_mois = 12                        # exception du 2026-11-16 : plis annuels (au lieu de 6 mois)
nombre_plis = 5                            # de 2020-01-01 à 2024-12-31 : 5 plis de 12 mois (au lieu de 10 plis de 6 mois)
validation_interne_mois = 6                # 6 derniers mois de cibles de chaque apprentissage : arrêt anticipé, réglage, s²
ajustement_commun = true                   # tous les modèles sont ajustés sur la même fenêtre d'ajustement
                                           # (l'apprentissage du pli sans sa validation interne)

[decoupage.modele_test_final]
ajustement_debut = 2018-04-01              # cibles d'ajustement du modèle évalué sur le test final
ajustement_fin = 2024-06-30
validation_debut = 2024-07-01              # validation interne du modèle du test final
validation_fin = 2024-12-31

# Périodes de crise pour l'analyse par régime, fixées avant tout résultat.
# Analysées sur les prévisions hors échantillon des plis walk-forward.
[crises.covid]
debut = 2020-03-01                         # krach lié au Covid
fin = 2020-04-30

[crises.terra_luna]
debut = 2022-05-01                         # effondrement de Terra et Luna
fin = 2022-06-30

[crises.ftx]
debut = 2022-11-01                         # faillite de FTX
fin = 2022-12-31

[cible]
nom = "RV"                                 # volatilité réalisée journalière
intervalle_rendements = "5m"               # log-rendements des clôtures de 5 minutes du jour UTC
formule = "racine de la somme des carrés des log-rendements"  # RV = sqrt(somme r_i^2)
horizon_jours = 1                          # prévoir RV de J+1 avec l'information connue à la clôture de J
transformation_modele = "log"              # les modèles prévoient log(RV)
annualisation_jours = 365                  # marché ouvert 7 jours sur 7

[cible.retour_log]
variance = "exp(2*y + 2*s2)"               # variance prévue (QLIKE), y = prévision de log(RV)
s2 = "variance_residus_log"                # variance des résidus en log
s2_mesuree_sur = "validation_interne"      # toujours, pour tous les modèles qui prévoient log(RV)
sensibilite_sans_correction = true         # sigma prévue avec s2 = 0, rapportée sans changer la décision
limite_s2 = "légèrement trop petit pour XGBoost et le deep learning (validation aussi utilisée pour le réglage) : prévisions un peu trop basses, désavantagées sous QLIKE"

[cible.volatilite_prevue]
formule = "sqrt(variance_prevue)"          # une seule volatilité prévue pour tout le projet
echelle = "journaliere"                    # sigma est une volatilité sur 1 jour
usages = ["RMSE", "MAE", "strategie", "VaR"]
limite = "un peu au-dessus de la moyenne de RV, ce qui pénalise légèrement le MAE"

[variables]
passe_strict = true                        # calculées uniquement jusqu'à la clôture de J incluse
rv_moyennes_jours = [1, 7, 30]             # RV moyenne sur 1, 7 et 30 jours (HAR adapté au 7 j/7)
estimateurs_journaliers = ["parkinson", "garman_klass"]  # volatilité à partir des prix extrêmes du jour
log_rendement_jour = true                  # log-rendement de clôture à clôture du jour
log_volume_jour = true                     # logarithme du volume échangé dans le jour
rsi_jours = 14                             # RSI sur 14 jours, clôtures journalières
macd = [12, 26, 9]                         # MACD : moyennes rapide, lente et ligne de signal
bollinger_jours = 20                       # bandes de Bollinger sur 20 jours
bollinger_ecarts_types = 2                 # largeur des bandes : 2 écarts-types
jour_semaine = true                        # jour de la semaine
fenetre_sequence_jours = 30                # longueur des séquences pour les modèles séquentiels

# Précisions datées du 2026-11-15, écrites avant le calcul des variables (raisons : docs/REGLES.md).
[variables.precisions]
date_ecriture = 2026-11-15
jour_ouverture = "premiere_bougie"         # ouverture de la première bougie du jour UTC
jour_plus_haut = "maximum_du_jour"
jour_plus_bas = "minimum_du_jour"
jour_cloture = "derniere_bougie"           # clôture de la dernière bougie du jour UTC
jour_volume = "somme_volume_cotation"      # volume en USDT (monnaie de cotation)
bougies_desalignees = "manquantes"         # comme au contrôle de qualité (exception 5)
rv_moyennes_en_log = "log_de_la_moyenne"   # log(moyenne de RV sur 1, 7 ou 30 jours)
log_rendement = "cloture_a_cloture"        # ln(clôture de J / clôture de J-1)
parkinson = "ln(H/L)^2 / (4 ln 2)"
garman_klass = "0.5 ln(H/L)^2 - (2 ln 2 - 1) ln(C/O)^2"
rsi_lissage = "wilder"                     # moyennes de Wilder (alpha = 1/14)
rsi_amorce = "moyenne_simple"              # la première moyenne est la moyenne simple des 14 premières variations
macd_amorce = "premiere_cloture"           # moyennes exponentielles démarrées à la première clôture
macd_variable = "histogramme_divise_par_cloture"  # comparable dans le temps
bollinger_ecart_type = "population"        # écart-type avec ddof = 0, comme la définition d'origine
bollinger_variable = "largeur_divisee_par_moyenne"  # (bande haute - bande basse) / moyenne mobile
jour_semaine_codage = "entier_0_lundi_6_dimanche"   # encodage choisi à l'étape des modèles
cible = "log_rv_j_plus_1"                  # cible = log(RV de J+1)

[variables.secours]
remplacement = "ligne_journaliere_entiere" # ouverture, haut, bas, clôture, volume et RV du dernier jour valide
calcul = "variables_sur_la_serie_remplacee" # toutes les variables sont calculées ensuite sur la série remplacée
limite = "rendement nul le jour remplacé, rendement sur deux jours le lendemain"
comptage = "remplacements_par_actif_et_par_periode"
comptage_fenetres_touchees = "developpement_par_actif"  # exemples dont la fenêtre de 30 jours contient un jour remplacé
validite_en_entree = "passe_seulement"     # contrôle automatique : la validité d'un jour n'utilise jamais l'avenir

[variables.sorties]
fichier = "data/processed/variables.parquet"   # jamais commité
manifeste = "data/manifeste_variables.json"    # empreinte de contenu ; cite les manifestes dont il dépend

[test_aveugle]
garde = "refus_sans_option"                # aucune option de contournement (paramètre, environnement, configuration)
autorise = "comptages_seulement"
ouverture = "construite_a_l_etape_du_test_final"

[exploration]
periode = "developpement_seulement"        # dates de cible jusqu'à decoupage.dev_fin
acf_retards_max = 60                       # autocorrélation de log(RV) jusqu'à 60 jours
acf_retards_rapportes = [1, 7, 30]
acf_jours_non_valides = "manquants"        # laissés vides (statsmodels, missing = "conservative")
adf_series = ["log_rv", "log_cloture"]     # contraste stationnaire / non stationnaire
adf_autolag = "AIC"
adf_jours_non_valides = "retires"          # limite écrite ; leur nombre est rapporté

[modeles]
liste = ["HAR-RV", "GARCH(1,1)", "XGBoost", "LSTM", "GRU", "CNN-LSTM", "Transformer", "TFT"]
graines_deep_learning = [0, 1, 2]          # exception du 2026-11-16 : 3 entraînements par modèle (au lieu de 5)
budget_reglage = 12                        # N, mesuré le 2026-11-16 : identique pour tous les modèles réglés (XGBoost compris)

# Règles d'entraînement : précisions datées du 2026-11-16, écrites avant tout entraînement
# (raisons : docs/REGLES.md, section 11).
[entrainement]
date_ecriture = 2026-11-16
un_modele_par_actif = true                 # BTC et ETH séparément, pour tous les modèles
variables_continues = ["rv_1", "rv_7", "rv_30", "log_rv_1", "log_rv_7", "log_rv_30", "parkinson", "garman_klass",
                       "log_rendement", "log_volume", "rsi_14", "macd_histogramme_relatif", "bollinger_largeur_relative"]
reperes_non_entrees = ["jour_remplace", "fenetre_avec_jour_remplace"]  # repères de comptage, jamais des entrées
jour_semaine_xgboost = "entier"            # tableau des variables du jour J, sans séquence
jour_semaine_sequentiels = "one_hot_7"     # LSTM, GRU, CNN-LSTM, Transformer : séquences de 30 jours
jour_semaine_tft = "categorielle_connue"
normalisation = "moyenne_ecart_type"       # apprise sur la fenêtre d'ajustement de chaque pli, enregistrée en JSON
normaliser_cible_reseaux = true            # log(RV) normalisée pour les réseaux ; sélection en unités de log(RV)
perte = "mse_log_rv"                       # erreur quadratique sur log(RV), pour tous les modèles réglés
selection = "plus_petite_mse_log_rv_validation_interne"
patience_epoques = 20
epoques_max = 200
xgboost_arbres_max = 2000
xgboost_patience_arbres = 50
dropout_reseaux_recurrents = "entre_couches_et_en_sortie"  # même valeur ; avec 1 couche : en sortie seulement
tft_perte = "mse"                          # limite : pas d'intervalles de quantiles
tft_normaliseurs_internes = false          # données déjà normalisées avec le JSON du pli
tft_lightning_allege = true                # sans barre, journaux, sauvegardes ni résumé : prévisions identiques au bit près
optimiseur = "adamw"                       # exception du 2026-11-16 : tous les modèles de deep learning
alimentation = "secteur_obligatoire"       # exception du 2026-11-16 : refus de démarrer sur batterie
arret_sur_batterie = "apres_unite_en_cours" # passage sur batterie pendant un calcul : arrêt propre, puis reprise
exceptions_date = 2026-11-16               # règle initiale irréalisable (docs/CHOIX.md) ; changée avant tout entraînement réel

[entrainement.recherche]
methode = "aleatoire"
graine = 42
combinaisons = "modeles.budget_reglage"    # N : même nombre de combinaisons VALIDES pour chaque modèle réglé
modeles_regles = ["XGBoost", "LSTM", "GRU", "CNN-LSTM", "Transformer", "TFT"]
tirages_incoherents = "ecartes_et_remplaces"  # remplacés par la suite déterministe des tirages ; nombre rapporté
graines_finales = "modeles.graines_deep_learning"  # la meilleure combinaison réentraînée avec ces graines
reglage = "une_fois_par_actif_et_modele"   # exception du 2026-11-16 : sur le premier découpage, puis figé
reglage_ajustement_debut = 2018-04-01      # = fenêtre d'ajustement du pli 1
reglage_ajustement_fin = 2019-06-30
reglage_validation_debut = 2019-07-01      # = validation interne du pli 1 (information disponible fin 2019)
reglage_validation_fin = 2019-12-31
hyperparametres_figes_pour = "5_plis_et_test_final"

[entrainement.espaces.xgboost]
max_depth = [2, 3, 4, 6]
learning_rate = { loi = "log_uniforme", min = 0.01, max = 0.1 }
subsample = [0.6, 0.8, 1.0]
colsample_bytree = [0.6, 0.8, 1.0]
min_child_weight = [1, 5, 10]
reg_lambda = { loi = "log_uniforme", min = 0.1, max = 10.0 }

[entrainement.espaces.lstm]
taille_cachee = [16, 32, 64]
couches = [1, 2]
dropout = [0.0, 0.1, 0.2, 0.3]
taux_apprentissage = { loi = "log_uniforme", min = 1e-4, max = 3e-3 }
lot = [32, 64]
weight_decay = { loi = "log_uniforme", min = 1e-6, max = 1e-3 }

[entrainement.espaces.gru]
meme_espace_que = "lstm"

[entrainement.espaces.cnn_lstm]
filtres = [16, 32]
noyau = [3, 5]
meme_espace_que = "lstm"                   # plus les réglages du LSTM

[entrainement.espaces.transformer]
d_model = [16, 32, 64]
tetes = [2, 4]
couches = [1, 2]
dimension_feed_forward = [64, 128]
dropout_lot_taux_weight_decay = "comme_lstm"

[entrainement.espaces.tft]
hidden_size = [8, 16, 32]
tetes_attention = [1, 2, 4]
hidden_continuous_size = [8, 16]
contrainte = "hidden_continuous_size <= hidden_size"  # tirages qui ne la respectent pas : écartés et remplacés
dropout_lot_taux_weight_decay = "comme_lstm"

[entrainement.reprise]
unite = ["actif", "modele", "pli", "combinaison", "graine"]  # une unité indépendante = un fichier
ecriture = "fichier_temporaire_puis_renommage"
graine_unite = "hachage_de_l_identifiant"  # jamais l'ordre d'exécution
relance = "unites_terminees_et_intactes_sautees"
veille_windows = "empechee_pendant_le_calcul"  # SetThreadExecutionState, rétabli à la fin, même en cas d'erreur

[entrainement.mesures]
donnees = "aleatoires_meme_forme"          # aucune vraie donnée lue (contrôlé par un crochet d'audit)
exemples = 2441                            # tout le développement : prudent (la plus grande fenêtre d'ajustement est plus petite)
epoques_estimees = 100                     # estimation prudente d'un arrêt anticipé moyen
budget_heures_deep_learning = 24           # exception du 2026-11-16 : 24 h (au lieu de 12), sur plusieurs nuits grâce à la reprise
formule_n = "actifs × somme_modeles(mediane_epoque × epoques_estimees) × (N + graines × decoupages) <= budget"
repetitions = 5                            # exception du 2026-11-16 : 5 répétitions par mesure, médiane et min-max
statistique = "mediane"
n_minimum = 5                              # en dessous : arrêt et rapport
marge_memoire = 1.5                        # seuil = pic × 1,5, arrondi au 0,5 Go supérieur
arrondi_memoire_go = 0.5
seuil_memoire_max_go = 2.5                 # au-delà : arrêt et rapport avant de fixer le seuil
depassement_suivi_max = 0.5                # durée réelle > estimation × 1,5 : arrêt propre, décision écrite et datée

[modeles.har_rv]
cible = "log_rv"                           # régression linéaire sur log(RV)
fenetres_jours = [1, 7, 30]                # composantes jour, semaine, mois

[modeles.garch]
p = 1                                      # un retard sur les chocs passés
q = 1                                      # un retard sur la variance passée
donnees = "rendements_journaliers"         # estimé sur les rendements journaliers
innovations = "student"                    # loi de Student pour les queues épaisses
facteur_echelle = "moyenne(RV2) / moyenne(variance_garch)"  # met la variance GARCH à l'échelle de RV²
parametres_appris_sur = "ajustement_du_pli" # exception du 2026-11-14 : sans la validation interne
facteur_appris_sur = "ajustement_du_pli"   # exception du 2026-11-14 ; puis appliqué tel quel à l'évaluation
variance_prevue = "variance_garch_mise_a_l_echelle"  # sigma prévue = sqrt(variance mise à l'échelle)

# Précisions datées du 2026-11-16, écrites avant le calcul des baselines (raisons : docs/REGLES.md, section 12).
[modeles.persistance]
role = "reference_descriptive"             # montrer ce qu'apporte HAR par rapport à « ne rien faire »
prevision = "log_rv_1_du_jour_j"           # log RV(J+1) prévu = log RV(J)
correction_s2 = "validation_interne"       # même correction que les autres modèles en log
dans_selection = false                     # hors de la règle de sélection
dans_diebold_mariano_principal = false     # hors des tests principaux
diebold_mariano_descriptif = "HAR-RV contre persistance"

[modeles.garch_precisions]
rendements = "log_rendement_des_variables_x100"  # même série que les autres modèles (règle de secours comprise), × 100
moyenne = "constante"
fenetre_estimation = "du_debut_des_donnees_a_la_fin_de_l_ajustement"
facteur_alignement = "variance_du_jour_t_avec_info_jusqu_a_t_moins_1_contre_rv2_du_jour_t"
mise_a_jour = "parametres_fixes_serie_coupee_a_l_origine"  # aucune donnée après J
backcast = "calcule_sur_l_ajustement_puis_fixe"           # variance de départ : jamais l'avenir
limite = "rendement nul le jour remplacé et rendement sur deux jours le lendemain (règle de secours)"

[modeles.xgboost]
combinaisons_communes_aux_actifs = true    # les mêmes 12 combinaisons pour BTC et ETH (graine 42)
normalisation = false                      # sans effet sur un arbre
arret_anticipe = "validation_interne_de_chaque_decoupage"

[modeles.transformer]
type = "encodeur"                          # encodeur seul
implementation = "manuelle"                # codé à la main, sans modèle tout prêt

[evaluation]
metrique_principale = "QLIKE"              # calculée sur la variance (RV au carré)
qlike_sur = "variance"
metriques_secondaires = ["RMSE", "MAE"]    # calculées sur RV
metriques_secondaires_sur = "RV"

[evaluation.precisions]                    # précisions datées du 2026-11-16, écrites avant le calcul des baselines
date_precisions = 2026-11-16
qlike_forme = "RV2/h - ln(RV2/h) - 1"      # forme de Patton : 0 si et seulement si h = RV²
prevision_modele_regle = "moyenne_des_log_des_graines"  # XGBoost et deep learning : DM, bootstrap, crises, figures, classement
s2_prevision_moyenne = "validation_interne"             # s² mesuré pour cette prévision moyenne
metriques_par_graine = "moyenne_et_ecart_type"          # chaque graine avec son propre s²
limite_ensemble = "la moyenne des graines forme un petit ensemble : léger avantage par rapport à HAR et GARCH, déterministes"
s2_variance = "centree_ddof_0"             # la moyenne des résidus est rapportée à part (exception 2)
sorties_journalieres = "sorties/"          # ignoré par Git : jamais commité (licence)
modeles_test_final = "entraines_et_enregistres_sans_aucune_prevision"
avenir_modifie_previsions = "persistance, HAR-RV, GARCH, XGBoost"  # prévisions des origines <= J identiques au bit près
avenir_modifie_temoin = "GARCH avec une variance de départ calculée sur toute la série"

[evaluation.diebold_mariano]
reference = "HAR-RV"                       # chaque modèle est comparé à HAR-RV
perte = "QLIKE"
erreurs = "HAC"                            # erreurs robustes à l'autocorrélation
retards_hac = "floor(4*(T/100)^(2/9))"     # règle de Newey-West, T = nombre de jours évalués
correction = "Harvey-Leybourne-Newbold"    # correction pour petits échantillons
seuil = 0.05                               # seuil de significativité de 5 %
test_principal = "plis_reunis"             # un seul test sur les jours évalués des plis réunis (5 plis annuels)
par_pli_et_par_crise = "descriptif"        # aucune conclusion de test (évite les tests multiples)
test_final = "un_seul_test"                # un seul test sur le test final
difference = "QLIKE(modele) - QLIKE(HAR-RV)"  # moyenne négative : le modèle fait mieux que HAR-RV
variance_long_terme = "newey_west_bartlett"
loi = "student_T_moins_1"
bilateral = true

[evaluation.tests_multiples]                # précision datée du 2026-11-19, écrite AVANT de lire les résultats du deep learning
date_tests_multiples = 2026-11-19
methode = "holm"                           # ajustement de Holm des p-valeurs (plusieurs comparaisons contre HAR-RV)
famille = "toutes_les_comparaisons_contre_har_rv_de_l_actif"  # GARCH, XGBoost et les 5 réseaux : 7 tests par actif
famille_portee = "plis_reunis"             # tests principaux du développement ; la persistance (descriptive) n'en fait pas partie
p_valeurs_rapportees = "brutes_et_ajustees"
significatif_selon = "p_valeur_ajustee"    # les phrases « significatif » de la lecture des résultats

[evaluation.controles_fuite]               # précision datée du 2026-11-19, écrite AVANT les contrôles de fuite sur les vraies données
date_controles_fuite = 2026-11-19
seuil_alerte_gain_qlike = 0.20             # un réseau qui bat HAR-RV de plus de 20 % en QLIKE moyen : arrêt, recherche d'une fuite
seuil_alerte_definitions = "les_deux"      # QLIKE sur les jours réunis ET moyenne des QLIKE moyens par pli
avenir_modifie_decoupage = "pli 5"         # le plus grand découpage qui a une période évaluée (celle du test final est fermée)
avenir_modifie_jour = 2024-07-01           # J au milieu de la période évaluée du pli 5 ; bougies après la fin de J × 10 avec bruit
avenir_modifie_epoques = 2
avenir_modifie_ecarts_admis = 0            # prévisions des origines <= J identiques au bit près, pour les 5 réseaux
temoin_cible_melangee_modele = "LSTM"      # combinaison retenue, graine 0 des plis, 5 plis, chaque actif
temoin_cible_melangee_graine = 42          # permutation des cibles de la fenêtre d'ajustement seulement
temoin_cible_melangee_arret = "gain_sur_har_rv_positif_ou_nul"  # selon l'une ou l'autre définition : arrêt, fuite probable

[evaluation.bootstrap]
niveau_confiance = 0.95                    # intervalles de confiance à 95 %
methode = "blocs"                          # bootstrap par blocs (garde la dépendance temporelle)
tirages = 1000                             # nombre de rééchantillonnages
taille_bloc_jours = 20                     # longueur d'un bloc
blocs = "mobiles"                          # blocs de jours consécutifs, débuts tirés au hasard
intervalle = "percentiles"                 # 2,5 % et 97,5 % de la moyenne rééchantillonnée
graine = 42

[evaluation.selection]
critere = "plus petit QLIKE moyen sur les plis walk-forward"  # règle de choix du modèle
choix_sur_test = false                     # sur le test final, tout est rapporté, rien n'est choisi
qlike_moyen = "moyenne_des_moyennes_par_pli"  # précision du 2026-11-16, décidée APRÈS les résultats des baselines ;
                                           # le QLIKE sur tous les jours réunis est aussi rapporté

[strategie]
methode = "volatility_targeting"           # exposition = volatilité cible / volatilité prévue
exposition = "vol_cible_annuelle / (sigma_journaliere * sqrt(365))"  # exception du 2026-11-14, bornée
annualisation_jours = 365                  # sigma journalière annualisée par racine(365) pour la stratégie
exposition_min = 0.0                       # pas de vente à découvert
exposition_max = 1.0                       # pas d'emprunt
rendement_liquidites = 0.0                 # la part non investie ne rapporte rien
vol_cible = "mediane_rv_annualisee_jours_valides"  # médiane de la RV annualisée des jours valides, par actif
vol_cible_debut = 2018-01-01               # calculée sur l'apprentissage seulement
vol_cible_fin = 2019-12-31
decalage_execution_jours = 1               # exposition décidée à la clôture de J, appliquée à J+1
frais = 0.001                              # 0,10 % de la valeur échangée
frais_sensibilite = [0.0005, 0.002]        # 0,05 % et 0,20 %, décrits sans changer la décision
comparaisons = ["buy_and_hold", "HAR-RV"]  # stratégies de référence
var_niveau = 0.95                          # VaR à 95 %
var_horizon_jours = 1                      # VaR à 1 jour
var_volatilite = "sigma_journaliere"       # exception du 2026-11-14 : sigma journalière, sans annualisation
var_loi = "normale"                        # même loi pour tous les modèles, appliquée à la volatilité prévue
var_test = "Kupiec"                        # test du nombre de dépassements (sévère attendu : queues épaisses)

[strategie.precisions]                     # précisions datées du 2026-11-19, écrites AVANT le calcul de la stratégie
date_precisions_strategie = 2026-11-19
periode = "developpement_5_plis"           # rendements des jours 2020-01-01 à 2024-12-31 ; le test final reste fermé
rendement = "simple_cloture_a_cloture_serie_remplacee"  # seuls les prix des jours valides servent
jour_non_valide = "pas_de_decision"        # l'exposition de la dernière clôture valide reste en place jusqu'à la clôture
                                           # valide suivante (le mouvement sur deux jours est porté par une exposition
                                           # décidée avant tout ce mouvement) ; aucun frais ce jour-là
var_jours_exclus = "jour_non_valide_et_lendemain"  # rendement nul ou sur deux jours : pas un rendement à un jour
exposition_initiale = 0.0                  # avant le 2020-01-01 : tout en liquidités ; l'entrée paie des frais (achat simple compris)
frais_base = "valeur_du_portefeuille_avant_le_jour"  # frais = taux × |variation d'exposition| × valeur du portefeuille
derive_du_poids = "ignoree"                # limite : entre deux rééquilibrages, le poids réel dérive avec le prix
quantile_var = "loi_normale_exacte"        # 1,6448536... (arrondi 1,6449 dans les textes)
sharpe = "moyenne / ecart_type des rendements journaliers x racine(365)"  # taux sans risque nul
sortino = "moyenne / racine(moyenne(min(r, 0)^2)) x racine(365)"
rendement_annualise = "geometrique, 365 jours"
rotation_annuelle = "somme |variation d'exposition| x 365 / nombre de jours"
bootstrap_sharpe = "blocs_mobiles_memes_indices_pour_la_difference"  # 20 jours, 1000 tirages, graine 42 (section evaluation.bootstrap)
comparaisons_principales = ["modele_retenu", "HAR-RV", "achat_simple"]  # les autres modèles sont descriptifs
cible_atteinte_tolerance = 0.10            # présentation seulement : volatilité réalisée à ±10 % de la cible = « proche de la cible »

[explicabilite]
shap_modeles = ["XGBoost", "LSTM"]         # contributions des variables par SHAP
attention_modeles = ["Transformer", "TFT"] # poids d'attention
regle_fidelite = "permuter la variable la mieux classée par SHAP doit dégrader le QLIKE de validation plus que permuter la moins bien classée"
